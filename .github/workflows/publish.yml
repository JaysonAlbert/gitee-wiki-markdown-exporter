name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gitee-wiki-markdown-exporter/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --dev --frozen
      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(uv run python -c 'from importlib.metadata import version; print(version("gitee-wiki-markdown-exporter"))')"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi
      - run: uv build
      - run: uvx --from twine twine check dist/*
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
